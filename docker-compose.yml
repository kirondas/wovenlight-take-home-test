name: tfl-scheduler

services:
  scheduler-api:
    container_name: tfl-scheduler-api
    build: .
    ports:
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql+psycopg2://tfl:tfl@postgres:5432/tfl_scheduler
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5555
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: tfl-scheduler-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tfl
      POSTGRES_PASSWORD: tfl
      POSTGRES_DB: tfl_scheduler
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfl -d tfl_scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
