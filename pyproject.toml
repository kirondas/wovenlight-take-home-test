[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wovenlight-scheduler"
version = "0.1.0"
description = "A Flask service for scheduling TfL Line Disruption API calls."
requires-python = ">=3.11"
dependencies = [
    "APScheduler>=3.10",
    "Flask>=3.0",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "testcontainers[postgres]>=4.8",
]

[project.scripts]
wovenlight-scheduler = "wovenlight_scheduler.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
